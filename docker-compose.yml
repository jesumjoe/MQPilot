version: '3.8'

services:
  edge_sensor:
    image: ubuntu:22.04
    container_name: edge_sensor
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - iot_lan
    volumes:
      - ./edge_sensor:/edge_sensor
    command: /bin/bash -c "apt update && apt install -y suricata iptables python3 python3-pip && bash /edge_sensor/setup_edge.sh && tail -f /dev/null"

  iot_broker:
    image: eclipse-mosquitto:latest
    container_name: iot_broker
    ports:
      - "1883:1883"
    networks:
      - iot_lan
    volumes:
      - ./iot_broker/mosquitto.conf:/mosquitto/config/mosquitto.conf

  traffic_gen:
    image: python:3.11-slim
    container_name: traffic_gen
    networks:
      - iot_lan
    volumes:
      - ./traffic_gen:/traffic_gen
    command: /bin/bash -c "pip install paho-mqtt && python /traffic_gen/generate_baseline.py"

  cloud_tier:
    image: python:3.11-slim
    container_name: cloud_tier
    ports:
      - "5000:5000"
    networks:
      - iot_lan
    command: /bin/bash -c "tail -f /dev/null" # Placeholder for your Flask/React App

  attacker_kali:
    image: kalilinux/kali-rolling
    container_name: attacker_kali
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - iot_lan
    command: /bin/bash -c "apt update && apt install -y hydra mosquitto-clients && tail -f /dev/null"

networks:
  iot_lan:
    driver: bridge
